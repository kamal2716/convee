name: Windows desktop package
on:
  workflow_dispatch:
  push:
    branches: [main, feature/complete-format-engines]
    paths:
      - 'src/**'
      - 'package.json'
      - '.github/workflows/windows-build.yml'
jobs:
  package:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # node-gyp versions used by uiohook-napi still import distutils.
      # Python 3.12+ removed it, so pin the build environment to 3.11.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Configure node-gyp Python
        shell: pwsh
        run: |
          $pythonPath = (python -c "import sys; print(sys.executable)").Trim()
          npm config set python $pythonPath
      - run: npm install
      - run: npm test
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: convee-windows
          path: release/*
          if-no-files-found: error
          retention-days: 14
