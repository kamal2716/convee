name: Convee verification (manual after feature build)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - run: node --check src/main.js
      - run: node --check src/renderer.js
      - run: node --check src/converter.js
