name: Test and build desktop app
on:
  push:
    branches: [main, feature/complete-format-engines]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - run: node --check src/main.js
      - run: node --check src/renderer.js
      - run: node --check src/converter.js
